name: Sync Roblox Avatars

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  avatars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and download Roblox avatars
        shell: bash
        run: |
          set -e
          mkdir -p images/avatars

          usernames="evnxl Dannyxl05 DushiNL0 Chocooza XxrealAntCrewXx smith0dev rogueexl dabbbbaa22 EnjoyCash Evader19237iwiw resonancescream jjgogmn234 ghosttttxl thebiggiant1122 SwimiumSon scrxptz_ll ocpstandard"

          for name in $usernames; do
            payload=$(jq -nc --arg username "$name" '{usernames:[$username],excludeBannedUsers:false}')
            response=$(curl -fsSL -X POST -H "Content-Type: application/json" -d "$payload" "https://users.roblox.com/v1/usernames/users")
            id=$(echo "$response" | jq -r '.data[0].id // empty')

            if [ -z "$id" ]; then
              echo "Could not resolve Roblox username: $name"
              continue
            fi

            image_url=$(curl -fsSL "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=$id&size=420x420&format=Png&isCircular=false" | jq -r '.data[0].imageUrl // empty')

            if [ -n "$image_url" ]; then
              curl -fsSL "$image_url" -o "images/avatars/$name.png"
              echo "Synced $name ($id)"
            else
              echo "No avatar returned for $name ($id)"
            fi
          done

      - name: Commit updated avatars
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/avatars
          if git diff --cached --quiet; then
            echo "No avatar changes."
          else
            git commit -m "Sync Roblox avatar images"
            git push
          fi
