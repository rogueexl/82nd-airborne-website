name: Deploy 82nd Airborne Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify avatar assets
        shell: bash
        run: |
          test -f images/avatars/evnxl.png
          test -f images/avatars/Dannyxl05.png
          test -f images/avatars/DushiNL0.png
          echo "AVATAR ASSETS: OK"
          ls -lh images/avatars/*.png

      - name: Write deployment marker
        shell: bash
        run: |
          printf '82ND DEPLOYMENT OK\nCommit: %s\nUpdated: %s\nAvatar assets: VERIFIED\n' "${GITHUB_SHA}" "$(date -u '+%Y-%m-%d %H:%M:%S UTC')" > deployment-status.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
